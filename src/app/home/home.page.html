<ion-header class="pokedex-header">
  <ion-toolbar>
    <div class="header-content">
      <div class="brand-text">
        <ion-title>Pokédex</ion-title>
        <p>Explore o universo Pokémon</p>
      </div>
    </div>
  </ion-toolbar>
</ion-header>


<ion-content class="pokedex-content">
  <section class="intro">
    <p class="eyebrow">EXPLORE O MUNDO POKÉMON</p>
    <h1>Sua Pokédex</h1>
    <p>Conheça os Pokémon, suas características e habilidades.</p>
  </section>

  <div class="search-container">
    <ion-searchbar
      placeholder="Buscar por nome ou número..."
      [debounce]="300"
      (ionInput)="filterPokemon($event)"
      aria-label="Buscar Pokémon"
    ></ion-searchbar>
  </div>

  <div class="status" *ngIf="loading">
    <ion-spinner name="crescent"></ion-spinner>
    <p>Carregando Pokémon...</p>
  </div>

  <div class="status error" *ngIf="!loading && error">
    <ion-text color="danger">{{ error }}</ion-text>
  </div>

  <div
    class="status"
    *ngIf="!loading && !error && filteredPokemon.length === 0"
  >
    <p>Nenhum Pokémon encontrado.</p>
  </div>

  <ion-grid *ngIf="!loading && !error">
    <ion-row>
      <ion-col
        size="6"
        size-md="4"
        size-lg="3"
        size-xl="2"
        *ngFor="let pokemon of filteredPokemon"
      >
        <ion-card
          class="pokemon-card"
          [routerLink]="['/pokemon-details', pokemon.name]"
          button="true"
        >
          <div class="pokemon-image">
            <span class="pokemon-number">
              #{{ pokemon.id.toString().padStart(3, '0') }}
            </span>

            <img
              [src]="pokemon.image"
              [alt]="formatName(pokemon.name)"
              loading="lazy"
            />
          </div>

          <ion-card-header>
            <ion-card-title>
              {{ formatName(pokemon.name) }}
            </ion-card-title>
          </ion-card-header>

          <ion-card-content>
            <span class="details-link">Ver detalhes →</span>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
