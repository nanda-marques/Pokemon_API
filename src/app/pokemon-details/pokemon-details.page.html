<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Detalhes do Pokémon</ion-title>
  </ion-toolbar>
</ion-header>


<ion-content *ngIf="pokemon">
  <ion-card>
    <img [src]="pokemon.sprites.front_default" alt="{{pokemon.name}}">
    <!--
    [] <- src não é um valor fixo / img pode mudar
    sprites - propriedade dentro desse objeto - contém várias imagens do Pokémon
    front_default - um dos campos dessa propriedade - contém a URL da imagem
     -->
    <ion-card-header>
      <ion-card-title>{{ pokemon.name | titlecase }}</ion-card-title>
    </ion-card-header>

    <ion-card-content>
      <p><strong>Tipo:</strong>
        <span *ngFor="let t of pokemon.types; let i = index">
        {{ t.type.name }}<span *ngIf="i < pokemon.types.length - 1"> / </span>
      </span>
    </p>
      <p><strong>Peso:</strong> {{ pokemon.weight / 10 }} kg</p>
      <p><strong>Altura:</strong> {{ pokemon.height / 10 }} m</p>
    </ion-card-content>
  </ion-card>
</ion-content>
